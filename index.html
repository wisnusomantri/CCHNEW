<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pencatatan Kegiatan Harian</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      /* Ver.2 (fix tampilan): supaya body benar-benar sepenuh layar, bukan cuma
         mengandalkan height:100% (yang gampang meleset kalau ada elemen lain kecil
         nyelip / margin default browser). */
      display: flex;
    }
    #app-frame {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      /* Fallback awal sebelum JS jalan (browser lama tanpa visualViewport tetap dapat 100vh) */
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <!--
    GANTI URL DI BAWAH dengan URL deployment Web App Apps Script kamu
    (yang berakhiran /exec). Ambil dari: Apps Script Editor -> Deploy ->
    Manage deployments -> salin "Web app URL".
  -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbxHyX2fhBe7he7aeZwIwfoZZqsKsQPJElZ_hiYAtS6kJQlesACJiwJWKMyerpkHsNdZ/exec"
    title="Sistem Pencatatan Kegiatan Harian"
    allow="clipboard-write"
    frameborder="0"
    scrolling="auto"
  ></iframe>

  <script>
    // FIX: sebelumnya iframe dikunci tinggi statis "100vh" dan halaman pembungkus ini
    // (html/body) discroll-mati (overflow:hidden). Akibatnya saat keyboard HP muncul
    // (mengetik di dalam form Apps Script), kotak iframe TIDAK ikut mengecil -- bagian
    // bawahnya (termasuk tombol Simpan) jadi ketutup keyboard, dan karena halaman
    // pembungkus ini sendiri tidak bisa discroll, sama sekali tidak ada cara untuk
    // mengungkapnya lagi. Fix ini bikin tinggi iframe mengikuti tinggi layar yang BENAR-
    // BENAR masih terlihat (window.visualViewport.height, yang otomatis ikut menyusut
    // saat keyboard muncul di Chrome/Edge Android) -- diupdate real-time, bukan cuma
    // dihitung sekali di awal.
    (function () {
      var frame = document.getElementById('app-frame');

      function setFrameHeight() {
        var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        frame.style.height = h + 'px';
      }

      setFrameHeight();
      window.addEventListener('resize', setFrameHeight);
      window.addEventListener('orientationchange', setFrameHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setFrameHeight);
        window.visualViewport.addEventListener('scroll', setFrameHeight);
      }
    })();
  </script>
</body>
</html>

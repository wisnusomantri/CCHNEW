<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sistem Pencatatan Kegiatan Harian</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #app-frame {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <!--
    GANTI URL DI BAWAH dengan URL deployment Web App Apps Script kamu
    (yang berakhiran /exec). Ambil dari: Apps Script Editor -> Deploy ->
    Manage deployments -> salin "Web app URL".
  -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzAhDMWpg87e_uNTM3ql8wwoeFfX001PsrLtlP7WDBj5i9HyIXHZ5YZs6kGb8TG4p-J/exec"
    title="Sistem Pencatatan Kegiatan Harian"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
